services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      NOTESAPP_KEY_B64: ${NOTESAPP_KEY_B64:?Missing NOTESAPP_KEY_B64}
      EXPORT_HMAC_KEY_B64: ${EXPORT_HMAC_KEY_B64:?Missing EXPORT_HMAC_KEY_B64}
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      JWT_SECRET: s3cr3t
      SECRET_KEY: dev-session-key
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    # Flaw #13: the container runs as root (see Dockerfile) and mounts more than it
    # needs - the host Docker socket and the whole project tree are exposed to it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host

volumes:
  pgdata:
